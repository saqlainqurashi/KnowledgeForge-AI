
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledgeforge-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      HF_HOME: /models/huggingface
    volumes:
      - huggingface_cache:/models/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledgeforge-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huggingface_cache:
